<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品溯源系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #e5e7eb;
        }
        .timeline-item:last-child::before { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl overflow-hidden">
        <header class="bg-gradient-to-r from-green-600 to-emerald-600 text-white py-4 px-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-qrcode text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">食品溯源系统</h1>
                    <p class="text-green-100 text-sm">正品保障 • 透明可溯</p>
                </div>
            </div>
        </header>

        <div id="loading" class="p-8 text-center">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-green-600 mb-4"></i>
            <p class="text-gray-600">正在查询溯源信息...</p>
        </div>

        <div id="error" class="hidden p-8 text-center">
            <i class="fa-solid fa-circle-exclamation text-5xl text-red-400 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-800 mb-2">未找到产品信息</h3>
            <p class="text-gray-600 mb-6">请检查二维码是否正确或联系客服</p>
            <button onclick="window.location.reload()" 
                    class="px-6 py-3 bg-green-600 text-white rounded-2xl font-medium hover:bg-green-700">
                重新扫描
            </button>
        </div>

        <div id="product-detail" class="hidden">
            <div class="p-6 border-b">
                <div class="flex gap-5">
                    <div id="product-image" class="w-28 h-28 bg-gray-100 rounded-3xl flex items-center justify-center text-6xl shadow-inner"></div>
                    <div class="flex-1 pt-2">
                        <div id="product-name" class="text-2xl font-bold text-gray-900"></div>
                        <div id="product-number" class="text-green-600 font-mono mt-1"></div>
                        <div class="flex items-center gap-2 mt-3">
                            <span class="px-3 py-1 bg-green-100 text-green-700 text-xs rounded-full font-medium">已溯源</span>
                            <span id="batch" class="text-sm text-gray-500"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-info-circle text-emerald-600"></i>产品信息
                    </h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="bg-gray-50 rounded-2xl p-4">
                            <p class="text-gray-500 text-xs">产地</p>
                            <p id="origin" class="font-medium mt-1"></p>
                        </div>
                        <div class="bg-gray-50 rounded-2xl p-4">
                            <p class="text-gray-500 text-xs">生产日期</p>
                            <p id="production-date" class="font-medium mt-1"></p>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-shield-halved text-emerald-600"></i>检测结果
                    </h3>
                    <div id="test-results" class="bg-emerald-50 border border-emerald-200 rounded-3xl p-5 text-sm space-y-3"></div>
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-truck text-emerald-600"></i>物流溯源
                    </h3>
                    <div id="logistics-timeline" class="relative pl-8 space-y-8"></div>
                </div>

                <div class="bg-gradient-to-br from-emerald-50 to-green-50 border border-emerald-200 rounded-3xl p-6 text-center">
                    <div class="flex justify-center mb-3">
                        <div class="w-16 h-16 bg-white rounded-2xl shadow flex items-center justify-center text-4xl">✅</div>
                    </div>
                    <h4 id="conclusion-title" class="font-bold text-xl text-emerald-800"></h4>
                    <p id="conclusion-text" class="text-emerald-700 mt-2 text-sm leading-relaxed"></p>
                </div>
            </div>

            <div class="bg-gray-100 py-6 px-6 text-center text-xs text-gray-500 border-t">
                <p>数据由区块链技术保障 • 防篡改</p>
                <p class="mt-1">查询时间：<span id="query-time"></span></p>
            </div>
        </div>
    </div>

    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                showError("缺少产品ID参数");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error('JSON文件加载失败');
                const data = await response.json();
                const products = data.products || data;
                
                const product = products.find(p => p.id === id);
                
                if (!product) {
                    showError();
                    return;
                }

                renderProduct(product);
            } catch (err) {
                console.error(err);
                showError("加载数据失败");
            }
        }

        function renderProduct(product) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('product-detail').classList.remove('hidden');

            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-number').textContent = `产品编号：${product.productNumber}`;
            document.getElementById('batch').textContent = `批次：${product.batch}`;
            document.getElementById('origin').textContent = product.origin;
            document.getElementById('production-date').textContent = product.productionDate;

            document.getElementById('product-image').innerHTML = `<span>${product.emoji || '🍎'}</span>`;

            const testContainer = document.getElementById('test-results');
            testContainer.innerHTML = `
                <div class="flex justify-between"><span>重金属残留</span><span class="font-medium text-emerald-700">${product.testResults.heavyMetal}</span></div>
                <div class="flex justify-between"><span>农药残留</span><span class="font-medium text-emerald-700">${product.testResults.pesticide}</span></div>
                <div class="flex justify-between"><span>微生物检测</span><span class="font-medium text-emerald-700">${product.testResults.microbe}</span></div>
            `;

            const timeline = document.getElementById('logistics-timeline');
            timeline.innerHTML = product.logistics.map(item => `
                <div class="timeline-item relative">
                    <div class="absolute -left-1 w-6 h-6 rounded-full bg-emerald-600 flex items-center justify-center">
                        <i class="fa-solid ${item.icon} text-white text-xs"></i>
                    </div>
                    <div class="ml-6">
                        <div class="font-medium">${item.time}</div>
                        <div class="text-sm text-gray-600">${item.status}</div>
                        <div class="text-xs text-gray-500">${item.location}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('conclusion-title').textContent = product.conclusion.title;
            document.getElementById('conclusion-text').textContent = product.conclusion.text;
            document.getElementById('query-time').textContent = new Date().toLocaleString('zh-CN');
        }

        function showError(msg = "未找到产品信息") {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        window.onload = loadProduct;
    </script>
</body>
</html>
